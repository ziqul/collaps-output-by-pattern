name: Release

# Every merge to main builds the binaries, publishes them as a GitHub release
# and updates the Homebrew formula in Formula/collapse.rb to point at them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "Formula/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build archives
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="collapse-${VERSION}-${os}-${arch}"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "build/${name}/collapse" .
            tar -C "build/${name}" -czf "dist/${name}.tar.gz" collapse
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "Built from ${GITHUB_SHA}."

      - name: Update Homebrew formula
        run: |
          mkdir -p Formula
          .github/scripts/generate-formula.sh "${VERSION}" dist > Formula/collapse.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/collapse.rb
          git commit -m "Update Homebrew formula to v${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
